[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-server"
version = "1.0.0"
description = "企业知识库智能助手（文档解析 → 中文切分 → Chroma 向量库 → RAG 问答）"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "chromadb>=0.4.22",
    "langchain-text-splitters>=0.2.0",   # 仅用其 RecursiveCharacterTextSplitter 做中文切分
    "openai>=1.0",                        # 通义百炼 OpenAI 兼容接口
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.scripts]
kb-server = "kb.main:main"

[tool.setuptools]
# pyproject.toml 所在目录本身就是 kb 包，故把当前目录映射为包 kb
package-dir = {"kb" = "."}
packages = ["kb", "kb.routers"]
